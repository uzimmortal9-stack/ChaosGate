version: 1

app:
  name: checkout-service
  type: python.api

services:
  api:
    url: http://localhost:8001
    health: /health

tests:
  unit:
    command: python -m pytest -q

load:
  duration: 6s
  vus: 6
  endpoints:
    - method: GET
      path: /health
    - method: POST
      path: /api/charge
  thresholds:
    p95_ms: 800
    error_rate: 0.05

security:
  secret_scan: true
  dependency_scan: true

chaos:
  enabled: false
