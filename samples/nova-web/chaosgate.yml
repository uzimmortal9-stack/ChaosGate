version: 1

app:
  name: nova-web
  type: js.react
  compose_file: docker-compose.yml

services:
  frontend:
    url: http://localhost:3000
    health: /health

tests:
  unit:
    command: node --test tests/*.js
  build:
    command: node scripts/build.js

load:
  target: http://localhost:3000
  duration: 8s
  vus: 6
  endpoints:
    - method: GET
      path: /
    - method: GET
      path: /health
  thresholds:
    p95_ms: 800
    error_rate: 0.05

security:
  secret_scan: true
  dependency_scan: true

chaos:
  enabled: true
  experiments:
    - restart_frontend
