# Prometheus configuration for the ChaosGate observability profile.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: chaosgate

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: chaosgate
    metrics_path: /metrics
    static_configs:
      - targets: ["chaosgate:5000"]
        labels:
          service: chaosgate
          component: control-plane

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Short-lived gate runs push here; honor_labels keeps their repo/run labels.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
